# Cross-platform HOSTED COMPATIBILITY testing for @cgsec/chaingate.
#
# Synthetic seeds only (test/acceptance/make-fixtures.mjs): no real seed, no private corpus, no
# secrets, read-only token, no publishing, tagging or release steps.
#
# Two independent jobs per platform, so a unit-test failure cannot hide the install/runtime
# acceptance result (or the other way round); the run fails if either fails:
#   * unit        — the repository test suite. Tests that need the private seed or corpus inputs
#                   (seed_export, the rc3 release candidate) skip here; the job lists every skip.
#                   This is COMPATIBILITY coverage, distinct from the full local qualification.
#   * acceptance  — installs the packed tarball the way users do (global; project; project with
#                   --ignore-scripts, none of which needs install script approval) and runs the
#                   acceptance script in `--mode hosted`. Hosted runners may be elevated (Windows
#                   runners are administrators), so this is NOT standard-account acceptance; that is
#                   a separate `--mode standard` run on a normal account.
name: cross-platform hosted compatibility

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit / ${{ matrix.os }} / node ${{ matrix.node }} / npm ${{ matrix.npm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]   # macos-15 = arm64, macos-15-intel = x64
        node: ['22', '24']        # the supported majors (package.json engines); nothing else is claimed
        npm: [bundled, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm version
        if: matrix.npm == 'latest'
        run: npm install -g npm@latest
      - name: record versions
        shell: bash
        run: echo "os=$RUNNER_OS arch=$RUNNER_ARCH node=$(node -v) npm=$(npm -v)" | tee versions.txt
      - name: install dependencies (no package in the tree has an install script)
        run: npm ci --no-audit --no-fund
      - name: native SQLite loads, and is the ready-built binary from the npm package (fail fast instead of hanging the suite)
        run: |
          node -e "const D=require('better-sqlite3'); const d=new D(':memory:'); d.prepare('select 1').get(); d.close(); console.log('better-sqlite3', require('better-sqlite3/package.json').version, 'loads')"
          node test/acceptance/check-native.mjs .
      - name: Windows spawn diagnostic (paths with 8.3 names, spaces, non-ASCII)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: node test/acceptance/spawn-diagnostic.mjs
      - name: unit and integration tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt; exit "${PIPESTATUS[0]}"
      - name: list skipped tests and their reasons
        if: always()
        shell: bash
        run: |
          # TAP (Node 22 when piped) marks skips '# SKIP'; the spec reporter (Node 24 default) marks them '﹣ ... # reason'
          grep -E '# SKIP|^ *﹣ ' test-output.txt | sed -E 's/^ *//' | sort | uniq -c | sort -rn | tee skipped.txt || true
          echo "skipped: $(grep -cE '# SKIP|^ *﹣ ' test-output.txt || true)"
      - name: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ matrix.os }}-node${{ matrix.node }}-npm-${{ matrix.npm }}
          path: |
            versions.txt
            test-output.txt
            skipped.txt

  acceptance:
    name: acceptance / ${{ matrix.os }} / node ${{ matrix.node }} / npm ${{ matrix.npm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
        node: ['22', '24']
        npm: [bundled, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm version
        if: matrix.npm == 'latest'
        run: npm install -g npm@latest
      - name: record versions
        shell: bash
        run: echo "os=$RUNNER_OS arch=$RUNNER_ARCH node=$(node -v) npm=$(npm -v) allow-scripts=$(npm config get allow-scripts)" | tee versions.txt
      - name: repository dependencies (for packing and synthetic fixtures)
        run: npm ci --no-audit --no-fund
      - name: native SQLite loads
        run: node -e "const D=require('better-sqlite3'); new D(':memory:').close(); console.log('ok')"
      - name: pack and make fixtures
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          node test/acceptance/make-fixtures.mjs "$RUNNER_TEMP/fixtures"
      - name: global install (no script approval)
        shell: bash
        run: |
          T="$(ls "$RUNNER_TEMP"/cgsec-chaingate-*.tgz)"
          npm install -g "$T" --foreground-scripts 2>&1 | tee "$RUNNER_TEMP/global-install.log"; st=${PIPESTATUS[0]}
          [ "$st" = 0 ] || exit $st
          # no package in the tree has an install script: npm must neither list one nor ask for approval
          if grep -E 'install-scripts|allow-scripts|approve-scripts' "$RUNNER_TEMP/global-install.log"; then echo 'npm lists an install script'; exit 1; fi
      - name: the installed native module is the ready-built binary from the npm package (no Python or compiler)
        shell: bash
        run: node test/acceptance/check-native.mjs "$(npm root -g)/@cgsec/chaingate" "$RUNNER_TEMP/global-install.log"
      - name: acceptance, global install
        shell: bash
        run: node test/acceptance/acceptance.mjs --mode hosted --launcher global --fixtures "$RUNNER_TEMP/fixtures" --report "$RUNNER_TEMP/acceptance-global.json"
      - name: acceptance, project install (no script approval)
        if: success() || failure()
        shell: bash
        run: node test/acceptance/acceptance.mjs --mode hosted --launcher local --project-scripts default --package "$(ls "$RUNNER_TEMP"/cgsec-chaingate-*.tgz)" --fixtures "$RUNNER_TEMP/fixtures" --report "$RUNNER_TEMP/acceptance-local-default.json"
      - name: acceptance, project install with --ignore-scripts
        if: success() || failure()
        shell: bash
        run: node test/acceptance/acceptance.mjs --mode hosted --launcher local --project-scripts ignore --package "$(ls "$RUNNER_TEMP"/cgsec-chaingate-*.tgz)" --fixtures "$RUNNER_TEMP/fixtures" --report "$RUNNER_TEMP/acceptance-local-ignore.json"
      - name: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-node${{ matrix.node }}-npm-${{ matrix.npm }}
          path: |
            versions.txt
            ${{ runner.temp }}/acceptance-*.json
            ${{ runner.temp }}/global-install.log

  # U-05 R2-2 D6: a REAL filesystem smaller than the seed. Admission refuses up front; forced past admission through the
  # test seam, the copy hits a real ENOSPC and the staging copy is removed. Linux: a tmpfs (CI may mount with sudo; the
  # local qualification host cannot). macOS: an hdiutil image. Windows: needs an administrator-made fixed-size VHD, so it
  # is NOT TESTED here.
  small-filesystem:
    name: D6 small filesystem / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: mount a 16 MiB filesystem
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            D=/mnt/cg-small
            sudo mkdir -p "$D" && sudo mount -t tmpfs -o "size=16m,uid=$(id -u),gid=$(id -g)" tmpfs "$D"
          else
            hdiutil create -size 16m -fs APFS -volname cgsmall "$RUNNER_TEMP/cgsmall.dmg"
            hdiutil attach "$RUNNER_TEMP/cgsmall.dmg"
            D=/Volumes/cgsmall
          fi
          df -k "$D"
          echo "CG_R22_SMALL_FS=$D" >> "$GITHUB_ENV"
      - name: D6 (it must RUN here, not skip)
        shell: bash
        run: |
          node --test test/cli/u05-r22-d-staging.test.js 2>&1 | tee d6-output.txt; rc=${PIPESTATUS[0]}
          if ! grep -E '^ok .* D6 ' d6-output.txt | grep -qv SKIP; then echo 'D6 did not run'; exit 1; fi
          exit "$rc"
      - name: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-${{ matrix.os }}
          path: d6-output.txt

  # U-05 gap-closure r2 §3.9, reduced: the unstored-BLOCK record and the log budget measured on this platform (the full
  # set runs on the Linux qualification host; Windows runs it from the kit). Figures are reported, not asserted as limits.
  measurement:
    name: r2 measurement (reduced) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: M1 M3 M4 L2 (reduced)
        shell: bash
        run: |
          mkdir -p measure
          for s in M3 M4 M1 L2; do node test/measure/r2-measure.mjs --pkg . --wt . --scenario $s --reduced --out measure/$s.json || rc=1; done
          exit ${rc:-0}
      - name: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ matrix.os }}
          path: measure/
